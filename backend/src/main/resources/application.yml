spring:
  application:
    name: kirana-ai-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}          # Required — set in .env or environment
      database: kiranaai

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET}                              # Required — min 64 chars
    access-token-expiry: ${JWT_ACCESS_EXPIRY:3600000}  # 1 hour in ms
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}  # 7 days in ms
  otp:
    expiry-minutes: 5
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com/v1beta/models
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Twilio WhatsApp Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
  sandbox-number: ${TWILIO_SANDBOX_NUMBER:+14155238886}
  sandbox-keyword: ${TWILIO_SANDBOX_KEYWORD:join poor-finally}
  enabled: ${TWILIO_ENABLED:false}   # false = demo/simulation mode (safe default)

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.kiranaai: DEBUG
    org.springframework.security: INFO

